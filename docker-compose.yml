version: '3.8'

services:
  web:
    build: .
    container_name: employeehub_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=docker-compose-secret-key-12345
      - DATABASE_URL=mysql+pymysql://hubuser:hubpassword@db:3306/employeehub_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mysql:8.0
    container_name: employeehub_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: employeehub_db
      MYSQL_USER: hubuser
      MYSQL_PASSWORD: hubpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always

volumes:
  mysql_data:
