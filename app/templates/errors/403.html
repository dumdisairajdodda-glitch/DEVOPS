{% extends "base.html" %}
{% block page_title %}Access Denied{% endblock %}
{% block content %}
<div class="card-saas text-center py-5 my-4">
  <div class="text-danger mb-3">
    <i class="bi bi-shield-x" style="font-size: 3.5rem;"></i>
  </div>
  <h2 class="fw-bold mb-2">403 - Forbidden</h2>
  <p class="text-muted mb-4">You do not have administrative clearance to access this function.</p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-sm px-4">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
