{% extends "base.html" %}
{% block page_title %}Page Not Found{% endblock %}
{% block content %}
<div class="card-saas text-center py-5 my-4">
  <div class="text-primary mb-3">
    <i class="bi bi-compass" style="font-size: 3.5rem;"></i>
  </div>
  <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
  <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been relocated.</p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-sm px-4">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
